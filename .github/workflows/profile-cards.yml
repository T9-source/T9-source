name: Profile Summary Cards

# كروت الإحصائيات الذاتية — تُرسم يومياً هنا ولا تعتمد على خدمات خارجية
# محدودة المعدل. الصور الناتجة تُخدم من نفس الريبو فلا تكسر أبداً.

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # نفس ثيم جيت هب الداكن — متوافق مع هوية اللوحة
          THEME: github_dark

      - name: Commit rendered cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output || true
          git diff --cached --quiet || git commit -m "cards: daily render"
          git push
